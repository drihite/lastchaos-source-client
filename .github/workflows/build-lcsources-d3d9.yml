name: Build external LCSources-D3D9 LC2015 client
on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/build-lcsources-d3d9.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-client:
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - name: Checkout public D3D9 source
        uses: actions/checkout@v4
        with:
          repository: tx00100xt/LCSources-D3D9
          ref: main
          path: d3d9
          persist-credentials: false
          fetch-depth: 1
      - name: Checkout established legacy Ecc tool sources
        uses: actions/checkout@v4
        with:
          repository: drihite/lastchaos-source-client
          ref: xtrap-free-win32
          path: legacy-ecc
          persist-credentials: false
          fetch-depth: 1
      - name: Locate compiler
        id: compiler
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.Component.MSBuild -property installationPath
          if (-not $vs) { throw 'No Visual Studio MSBuild installation' }
          "msbuild=$vs\MSBuild\Current\Bin\MSBuild.exe" >> $env:GITHUB_OUTPUT
          Write-Host "Using $vs"
      - name: Install Ecc parser prerequisites
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $url = 'https://github.com/lexxmark/winflexbison/releases/download/v2.5.25/win_flex_bison-2.5.25.zip'
          $archive = Join-Path $env:RUNNER_TEMP 'win_flex_bison.zip'
          $directory = Join-Path $env:RUNNER_TEMP 'winflexbison'
          Invoke-WebRequest -Uri $url -OutFile $archive
          $sha = (Get-FileHash -Algorithm SHA256 $archive).Hash.ToLowerInvariant()
          if ($sha -ne '8d324b62be33604b2c45ad1dd34ab93d722534448f55a16ca7292de32b6ac135') { throw "WinFlexBison SHA256 mismatch: $sha" }
          Expand-Archive -Path $archive -DestinationPath $directory -Force
          foreach ($name in @('win_bison.exe','win_flex.exe')) {
            if (-not (Test-Path (Join-Path $directory $name))) { throw "Missing $name in $directory" }
          }
          Copy-Item (Join-Path $directory 'win_bison.exe') (Join-Path $directory 'bison.exe') -Force
          Copy-Item (Join-Path $directory 'win_flex.exe') (Join-Path $directory 'flex.exe') -Force
          $directory >> $env:GITHUB_PATH
      - name: Build and register legacy Ecc compiler
        shell: pwsh
        run: |
          $msbuild = "${{ steps.compiler.outputs.msbuild }}"
          & $msbuild 'legacy-ecc\Ecc\Ecc_2010.vcxproj' /m:1 /t:Build /p:Configuration=Release /p:Platform=Win32 /p:PlatformToolset=v143 /v:minimal "/flp:logfile=d3d9-ecc.log;verbosity=diagnostic"
          if ($LASTEXITCODE -ne 0) { throw 'Ecc tool compilation failed' }
          $ecc = (Resolve-Path 'legacy-ecc\Ecc\Release\Ecc.exe' -ErrorAction Stop).Path
          $eccDir = Split-Path $ecc -Parent
          $eccDir >> $env:GITHUB_PATH
          Write-Host "Ecc compiler added to PATH: $ecc"
      - name: Adapt legacy Boost.Asio network API
        shell: pwsh
        run: |
          $base = 'd3d9/VSProjects/LC2015/Client/Sources.VS2019.DX9/Engine'
          $files = @('Network/NetClient.h','Network/NetClient.cpp','Contents/Login/UILoginNew.cpp')
          foreach ($file in $files) {
            $path = Join-Path $base $file
            if (-not (Test-Path $path)) { throw "Missing legacy network file: $path" }
            $source = [System.IO.File]::ReadAllText($path)
            if (-not $source.Contains('boost::asio::io_service')) { throw "Expected io_service not found: $path" }
            $source = $source.Replace('boost::asio::io_service', 'boost::asio::io_context')
            if ($file -eq 'Network/NetClient.cpp') {
              $start = $source.IndexOf('#if BOOST_VERSION < 107000')
              $endMarker = 'while (error && endpoint_iterator != end)'
              $end = $source.IndexOf($endMarker, $start)
              if ($start -lt 0 -or $end -lt 0) { throw 'Unable to locate old resolver/connection block' }
              $brace = $source.IndexOf('{', $end)
              $close = $source.IndexOf('}', $brace)
              if ($brace -lt 0 -or $close -lt 0) { throw 'Unable to locate old resolver/connection loop' }
              $replacement = (@(
                'boost::asio::ip::tcp::resolver resolver(_socket.get_executor());',
                'boost::system::error_code error;',
                'auto endpoints = resolver.resolve(IP, port, error);',
                'if (!error) {',
                '    _socket.close();',
                '    boost::asio::connect(_socket, endpoints, error);',
                '}'
              ) -join [Environment]::NewLine) + [Environment]::NewLine
              $source = $source.Substring(0, $start) + $replacement + $source.Substring($close + 1)
            }
            [System.IO.File]::WriteAllText($path, $source)
            Write-Host "Updated Boost.Asio compatibility: $file"
          }
      - name: Configure Win32 Boost dependencies
        shell: pwsh
        run: |
          $root = $env:VCPKG_INSTALLATION_ROOT
          if (-not $root) { $root='C:\vcpkg' }
          $vcpkg = Join-Path $root 'vcpkg.exe'
          if (-not (Test-Path $vcpkg)) { throw "Missing vcpkg: $vcpkg" }
          & $vcpkg install boost-thread:x86-windows boost-format:x86-windows boost-multi-index:x86-windows boost-bind:x86-windows boost-function:x86-windows boost-smart-ptr:x86-windows boost-asio:x86-windows boost-system:x86-windows
          if ($LASTEXITCODE -ne 0) { throw 'Could not install Boost dependencies' }
          & $vcpkg integrate install
          if ($LASTEXITCODE -ne 0) { throw 'Could not integrate vcpkg' }
          "BOOST_ROOT=$(Join-Path $root 'installed\x86-windows')" >> $env:GITHUB_ENV
      - name: Provision D3DX9 Win32 import library
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = '9.29.952.8'
          $package = 'microsoft.dxsdk.d3dx'
          $url = "https://api.nuget.org/v3-flatcontainer/$package/$version/$package.$version.nupkg"
          $zip = Join-Path $env:RUNNER_TEMP 'd3dx.zip'
          $root = Join-Path $env:RUNNER_TEMP 'd3dx-package'
          Invoke-WebRequest -Uri $url -OutFile $zip
          Expand-Archive -Path $zip -DestinationPath $root -Force
          $lib = Join-Path $root 'build/native/release/lib/x86'
          if (-not (Test-Path (Join-Path $lib 'd3dx9.lib'))) { throw "Missing Win32 d3dx9.lib in $lib" }
          $sdkLib = 'd3d9/VSProjects/LC2015/Client/Tools.Win32/Libraries/DX9SDK/lib/x86'
          New-Item -ItemType Directory -Path $sdkLib -Force | Out-Null
          Copy-Item (Join-Path $lib '*.lib') -Destination $sdkLib -Force
          if (-not (Test-Path (Join-Path $sdkLib 'd3dx9.lib'))) { throw 'D3DX9 SDK library not staged' }
          "LIB=$lib;$env:LIB" >> $env:GITHUB_ENV
          Write-Host "Staged DirectX 9 Win32 libraries in solution LibraryPath: $sdkLib"
      - name: Resolve legacy Quest comparator ambiguity
        shell: pwsh
        run: |
          $path = 'd3d9/VSProjects/LC2015/Client/Sources.VS2019.DX9/Engine/Contents/Base/Quest.h'
          $source = [System.IO.File]::ReadAllText($path)
          $old = 'class Compare : unary_function<Quest::stRestoreInfo, bool>'
          $new = 'class Compare'
          if (-not $source.Contains($old)) { throw 'Expected legacy Quest comparator not found' }
          $source = $source.Replace($old, $new)
          [System.IO.File]::WriteAllText($path, $source)
      - name: Compile LCRelease Win32 client (experimental)
        id: compile
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $solution = 'd3d9\VSProjects\LC2015\Client\Sources.VS2019.DX9\LCClient.sln'
          if (-not (Test-Path $solution)) { throw "Missing upstream solution: $solution" }
          & "${{ steps.compiler.outputs.msbuild }}" $solution /m:2 /t:Build /p:Configuration=LCRelease /p:Platform=Win32 /p:PlatformToolset=v143 /p:WindowsTargetPlatformVersion=10.0 /v:minimal "/flp:logfile=d3d9-build.log;verbosity=diagnostic"
          $exitCode = $LASTEXITCODE
          if ($exitCode -ne 0) {
            Write-Host 'Compilation error excerpts:'
            Select-String -Path d3d9-build.log -Pattern 'error C[0-9]+|error LNK[0-9]+|error MSB[0-9]+|fatal error|error :' | Select-Object -First 30 | ForEach-Object { Write-Host $_.Line }
            exit $exitCode
          }
      - name: Inventory compiled files
        if: steps.compile.outcome == 'success'
        shell: pwsh
        run: |
          $base = 'd3d9\VSProjects\LC2015\Client'
          $bins = @(Get-ChildItem $base -Include Nksp.exe,Engine.dll,GameMP.dll,EntitiesMP.dll,Shaders.dll -Recurse -File)
          $bins | ForEach-Object { "$($_.FullName) $($_.Length)" } | Set-Content d3d9-output-inventory.txt
          if (-not ($bins | Where-Object Name -eq 'Nksp.exe')) { throw 'No Nksp.exe was generated' }
          Write-Host 'Compiled Nksp.exe is present; runtime compatibility is unverified.'
      - name: Save build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: d3d9-build-log
          path: |
            d3d9-build.log
            d3d9-ecc.log
            d3d9-output-inventory.txt
          if-no-files-found: warn
          retention-days: 7
      - name: Save executables for isolated testing
        if: steps.compile.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: d3d9-lc2015-unverified-build
          path: |
            d3d9/VSProjects/LC2015/Client/**/Release/*.exe
            d3d9/VSProjects/LC2015/Client/**/Release/*.dll
          if-no-files-found: warn
          retention-days: 3
