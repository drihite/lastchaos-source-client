name: Win32 Last Chaos experimental build
on:
  # A single push to the trigger file runs the private compatibility test once.
  push:
    branches: [master]
    paths:
      - 'docs/TRIGGER_PRIVATE_TEST.txt'
  workflow_dispatch:
    inputs:
      link_mode:
        description: 'Strict SafeSEH check or private legacy compatibility build (unverified; no third-party redistributables)'
        required: true
        type: choice
        default: strict_safeseh
        options:
          - strict_safeseh
          - legacy_compat_audit

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: xtrap-free-win32
      - name: Check X-Trap build defines
        shell: pwsh
        run: |
          $regions = 'BRA','GAMIGO','RUS','USA'
          foreach ($region in $regions) {
            $path = "Engine/Define_$region.h"
            if (Select-String -Path $path -Pattern '^\s*#define\s+XTRAP_SECURE_CKBANG_2010_07_20\b' -Quiet) {
              throw "X-Trap still enabled in $path"
            }
            Write-Host "X-Trap disabled in $path"
          }
      - name: Verify GameMP compiler fix before expensive tool setup
        shell: pwsh
        run: |
          $consoleText = [System.IO.File]::ReadAllText((Resolve-Path 'GameMP/Console.cpp').Path)
          if (-not $consoleText.Contains('strEditingLine.RemovePrefix("/" CHEAT_PREFIX);')) {
            throw 'Expected fixed GameMP/Console.cpp slash-prefix expression is missing from checkout'
          }
          Write-Host 'GameMP/Console.cpp prefix fix is present in xtrap-free-win32'
      - name: Verify migrated Boost.Asio network code
        shell: pwsh
        run: |
          $paths = 'Engine/Network/NetClient.h','Engine/Network/NetClient.cpp','Engine/Contents/Login/UILoginNew.cpp'
          if (Select-String -Path $paths -Pattern 'boost::asio::io_service|_socket.get_io_service\(' -Quiet) {
            throw "Legacy Boost.Asio API remains in network client files"
          }
          Write-Host "Boost.Asio io_context migration detected"
      - name: Locate Visual Studio build tools
        id: vs
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.Component.MSBuild -property installationPath
          if (-not $vs) { throw "MSBuild not found" }
          "path=$vs" >> $env:GITHUB_OUTPUT
          Write-Host "VS: $vs"
      - name: Prepare legacy DirectX 8 and D3DX8 build dependencies
        shell: pwsh
        run: |
          # Build-only SDK retrieval; do not commit or upload SDK material.
          # Third-party archive of Microsoft's SDK: license must be respected.
          $root = Join-Path $env:RUNNER_TEMP 'directx8-sdk'
          git clone --depth 1 --filter=blob:none --sparse https://github.com/edgeforce/directx8.git $root
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Push-Location $root
          git fetch --depth 1 origin e6fa10f5f92bf523c15fdb068206ce25c8d2121d
          if ($LASTEXITCODE -ne 0) { throw 'Pinned SDK source unavailable' }
          git checkout --detach e6fa10f5f92bf523c15fdb068206ce25c8d2121d
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git sparse-checkout set include lib license
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Pop-Location

          $srcInc = Join-Path $root 'include'
          $srcLib = Join-Path $root 'lib'
          $out = Join-Path $env:RUNNER_TEMP 'legacy-dx8-build'
          $inc = Join-Path $out 'include'
          $lib = Join-Path $out 'lib'
          New-Item -ItemType Directory -Force -Path $inc,$lib | Out-Null
          $headers = @(
            'd3d8.h', 'd3d8types.h', 'd3d8caps.h',
            'd3dx8.h', 'd3dx8core.h', 'd3dx8tex.h',
            'd3dx8math.h', 'd3dx8math.inl',
            'd3dx8mesh.h', 'd3dx8shape.h', 'd3dx8effect.h',
            'dxfile.h', 'dxerr8.h'
          )
          foreach ($file in $headers) {
            $source = Join-Path $srcInc $file
            if (-not (Test-Path $source)) { throw "DX8 SDK required header missing: $file" }
            Copy-Item $source (Join-Path $inc $file) -Force
          }
          foreach ($file in @('d3d8.lib', 'd3dx8.lib', 'dxguid.lib', 'd3dxof.lib')) {
            $source = Join-Path $srcLib $file
            if (-not (Test-Path $source)) { throw "DX8 SDK required Win32 library missing: $file" }
            Copy-Item $source (Join-Path $lib $file) -Force
          }
          "DX8_INCLUDE=$inc" >> $env:GITHUB_ENV
          "DX8_LIB=$lib" >> $env:GITHUB_ENV
          Write-Host "Prepared legacy DirectX8 and D3DX8 build-only headers and libs"
      - name: Install Ecc parser prerequisites
        id: parser
        shell: pwsh
        run: |
          choco install winflexbison3 -y --no-progress
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $directory = Join-Path $env:ChocolateyInstall "lib\\winflexbison3\\tools"
          if (-not (Test-Path (Join-Path $directory "win_bison.exe"))) { throw "win_bison.exe was not found in $directory" }
          Copy-Item (Join-Path $directory "win_bison.exe") (Join-Path $directory "bison.exe") -Force
          Copy-Item (Join-Path $directory "win_flex.exe") (Join-Path $directory "flex.exe") -Force
          Add-Content $env:GITHUB_PATH $directory
      - name: Build Last Chaos Ecc tool
        id: ecc
        shell: pwsh
        run: |
          $msbuild = Join-Path "${{ steps.vs.outputs.path }}" "MSBuild\\Current\\Bin\\MSBuild.exe"
          & $msbuild "Ecc\\Ecc_2010.vcxproj" /m:1 /t:Build /p:Configuration=Release /p:Platform=Win32 /p:PlatformToolset=v143 /v:minimal "/flp:logfile=ecc-win32.log;verbosity=diagnostic"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path "Ecc\\Release\\Ecc.exe")) { throw "Ecc.exe was not generated in Ecc/Release" }
          (Resolve-Path "Ecc\\Release").Path >> $env:GITHUB_PATH
      - name: Install Boost thread for Win32
        id: boost
        shell: pwsh
        run: |
          $vcpkgRoot = $env:VCPKG_INSTALLATION_ROOT
          if (-not $vcpkgRoot) { $vcpkgRoot = 'C:\vcpkg' }
          $vcpkg = Join-Path $vcpkgRoot 'vcpkg.exe'
          if (-not (Test-Path $vcpkg)) { throw "vcpkg.exe not found at $vcpkg" }
          & $vcpkg install boost-thread:x86-windows boost-format:x86-windows boost-multi-index:x86-windows boost-bind:x86-windows boost-function:x86-windows boost-smart-ptr:x86-windows boost-asio:x86-windows
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $vcpkg integrate install
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path (Join-Path $vcpkgRoot "installed\x86-windows\include\boost\asio.hpp"))) { throw "Boost Asio missing" }
          if (-not (Test-Path (Join-Path $vcpkgRoot "installed\x86-windows\include\boost\multi_index_container.hpp"))) { throw "Boost MultiIndex missing" }
          if (-not (Test-Path (Join-Path $vcpkgRoot "installed\x86-windows\include\boost\format.hpp"))) { throw "Boost format header missing after installation" }
          if (-not (Test-Path (Join-Path $vcpkgRoot "installed\x86-windows\include\boost\thread.hpp"))) {
            throw "Boost thread header missing after installation"
          }

      - name: Rebuild bundled Lua 5.1 sources with matching Win32 CRT
        shell: pwsh
        run: |
          $sources = Get-ChildItem -Path "Engine/lua" -Filter "*.c" -File | Where-Object { $_.Name -ne 'print.c' } | Sort-Object Name
          if ($sources.Count -lt 20) { throw "Incomplete Lua 5.1 source list" }
          $entries = ($sources | ForEach-Object { '    <ClCompile Include="' + [System.Security.SecurityElement]::Escape($_.FullName) + '" />' }) -join "`n"
          $projectText = @'
          <Project DefaultTargets="Build" ToolsVersion="Current" xmlns="http://schemas.microsoft.com/developer/msbuild/2003">
            <ItemGroup Label="ProjectConfigurations">
              <ProjectConfiguration Include="Release|Win32"><Configuration>Release</Configuration><Platform>Win32</Platform></ProjectConfiguration>
            </ItemGroup>
            <PropertyGroup Label="Globals">
              <ProjectGuid>{B9DC4C9A-3184-439E-8238-F99DCC2A4AAC}</ProjectGuid>
              <Keyword>Win32Proj</Keyword>
              <RootNamespace>LastChaosLua51</RootNamespace>
            </PropertyGroup>
            <Import Project="$(VCTargetsPath)\Microsoft.Cpp.Default.props" />
            <PropertyGroup Condition="'$(Configuration)|$(Platform)'=='Release|Win32'" Label="Configuration">
              <ConfigurationType>StaticLibrary</ConfigurationType>
              <PlatformToolset>v143</PlatformToolset>
              <CharacterSet>MultiByte</CharacterSet>
            </PropertyGroup>
            <Import Project="$(VCTargetsPath)\Microsoft.Cpp.props" />
            <PropertyGroup Condition="'$(Configuration)|$(Platform)'=='Release|Win32'">
              <OutDir>$(ProjectDir)lua-out\</OutDir>
              <IntDir>$(ProjectDir)lua-int\</IntDir>
              <TargetName>lua5.1</TargetName>
            </PropertyGroup>
            <ItemDefinitionGroup Condition="'$(Configuration)|$(Platform)'=='Release|Win32'">
              <ClCompile>
                <RuntimeLibrary>MultiThreadedDLL</RuntimeLibrary>
                <PreprocessorDefinitions>_CRT_SECURE_NO_WARNINGS;%(PreprocessorDefinitions)</PreprocessorDefinitions>
                <WarningLevel>Level3</WarningLevel>
              </ClCompile>
            </ItemDefinitionGroup>
            <ItemGroup>
          __LUA_FILES__
            </ItemGroup>
            <Import Project="$(VCTargetsPath)\Microsoft.Cpp.targets" />
          </Project>
          '@
          $projectPath = Join-Path $env:RUNNER_TEMP 'lua5.1-v143.vcxproj'
          [System.IO.File]::WriteAllText($projectPath, $projectText.Replace('__LUA_FILES__', $entries))
          $msbuild = Join-Path "${{ steps.vs.outputs.path }}" "MSBuild\Current\Bin\MSBuild.exe"
          & $msbuild $projectPath /m:1 /t:Build /p:Configuration=Release /p:Platform=Win32 /p:PlatformToolset=v143 /v:minimal "/flp:logfile=lua-win32.log;verbosity=diagnostic"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $built = Join-Path $env:RUNNER_TEMP 'lua-out\lua5.1.lib'
          if (-not (Test-Path $built)) { throw 'Lua 5.1 static library missing after rebuild' }
          Copy-Item $built 'Engine/lua/lua5.1.lib' -Force
          Write-Host "Rebuilt original Lua 5.1 as x86 /MD for diagnostic client build"
      - name: Rebuild original libpng and zlib under isolated symbol names
        shell: pwsh
        run: |
          # D3DX8 contains ancient PNG/zlib objects; isolate newer copies.
          $pngDir = (Resolve-Path '3rdparty/lpng163').Path
          $zDir = (Resolve-Path '3rdparty/zlib-1.2.8').Path
          $tempDir = Join-Path $env:RUNNER_TEMP 'lc-isolated-libs'
          New-Item -ItemType Directory -Force -Path $tempDir | Out-Null
          $prefixPath = Join-Path $tempDir 'lc-png-prefix.h'
          $symbolNames = [System.Collections.Generic.HashSet[string]]::new()
          $filesToScan = @(Get-ChildItem $pngDir -File | Where-Object { $_.Extension -eq '.h' -or $_.Extension -eq '.c' })
          foreach ($source in $filesToScan) {
            $matches = [regex]::Matches([System.IO.File]::ReadAllText($source.FullName), '\bpng_[A-Za-z_][A-Za-z0-9_]*\b')
            foreach ($match in $matches) { [void]$symbolNames.Add($match.Value) }
          }
          if ($symbolNames.Count -lt 150) { throw "PNG symbol discovery failed: $($symbolNames.Count)" }
          $renameLines = @('#ifndef LC_PNG_PREFIX_H','#define LC_PNG_PREFIX_H')
          # Do not rename function-like debugging macros: pngdebug.h supplies their implementations.
          # Renaming them prevents the macros from being defined and creates unresolved lc_png_debug* calls.
          $macroOnly = @('png_debug','png_debug1','png_debug2')
          $renameLines += @($symbolNames | Where-Object { $_ -notin $macroOnly } | Sort-Object | ForEach-Object { '#define ' + $_ + ' lc_' + $_ })
          $renameLines += '#endif'
          [System.IO.File]::WriteAllLines($prefixPath, [string[]]$renameLines)
          $luaProjectPath = Join-Path $env:RUNNER_TEMP 'lua5.1-v143.vcxproj'
          if (-not (Test-Path $luaProjectPath)) { throw 'Lua MSBuild template not found' }
          $msbuild = Join-Path "${{ steps.vs.outputs.path }}" 'MSBuild\Current\Bin\MSBuild.exe'
          function Build-LegacyStatic([string]$name,[string]$root,[string[]]$sourceNames,[string]$forced) {
            [xml]$doc = Get-Content $luaProjectPath -Raw
            $ns = New-Object System.Xml.XmlNamespaceManager($doc.NameTable)
            $ns.AddNamespace('p','http://schemas.microsoft.com/developer/msbuild/2003')
            $group = $doc.SelectSingleNode('//p:ItemGroup[p:ClCompile]',$ns)
            if (-not $group) { throw 'Lua template C source group not found' }
            $group.RemoveAll()
            foreach ($basename in $sourceNames) {
              $sourcePath = Join-Path $root ($basename + '.c')
              if (-not (Test-Path $sourcePath)) { throw "Missing source $sourcePath" }
              $n = $doc.CreateElement('ClCompile',$doc.DocumentElement.NamespaceURI)
              $n.SetAttribute('Include',$sourcePath)
              [void]$group.AppendChild($n)
            }
            $properties = $doc.SelectSingleNode('//p:PropertyGroup[p:TargetName]',$ns)
            if (-not $properties) { throw 'Lua template output properties missing' }
            $properties.TargetName = $name
            $properties.OutDir = (Join-Path $tempDir ($name + '-out')) + '\'
            $properties.IntDir = (Join-Path $tempDir ($name + '-int')) + '\'
            $cl = $doc.SelectSingleNode('//p:ItemDefinitionGroup/p:ClCompile',$ns)
            if (-not $cl) { throw 'Lua template C compile options missing' }
            # Force function exports for png_get_uint_16/32; libpng read macros otherwise override symbol prefixes.
            $cl.PreprocessorDefinitions = 'Z_PREFIX;PNG_NO_USE_READ_MACROS;' + [string]$cl.PreprocessorDefinitions
            $incs = $doc.CreateElement('AdditionalIncludeDirectories',$doc.DocumentElement.NamespaceURI)
            $incs.InnerText = "$pngDir;$zDir;%(AdditionalIncludeDirectories)"
            [void]$cl.AppendChild($incs)
            if ($forced) {
              $fi = $doc.CreateElement('ForcedIncludeFiles',$doc.DocumentElement.NamespaceURI)
              $fi.InnerText = $forced
              [void]$cl.AppendChild($fi)
            }
            $projPath = Join-Path $tempDir ($name + '.vcxproj')
            $doc.Save($projPath)
            & $msbuild $projPath /m:1 /t:Build /p:Configuration=Release /p:Platform=Win32 /p:PlatformToolset=v143 /v:minimal "/flp:logfile=$name-win32.log;verbosity=diagnostic"
            if ($LASTEXITCODE -ne 0) { throw "Failed building isolated $name" }
            $libPath = Join-Path (Join-Path $tempDir ($name + '-out')) ($name + '.lib')
            if (-not (Test-Path $libPath)) { throw "Missing isolated $name.lib" }
            Copy-Item $libPath (Join-Path $env:DX8_LIB ($name + '.lib')) -Force
          }
          $zSources = @('adler32','compress','crc32','deflate','gzclose','gzlib','gzread','gzwrite','infback','inffast','inflate','inftrees','trees','uncompr','zutil')
          $pngSources = @('png','pngerror','pngget','pngmem','pngpread','pngread','pngrio','pngrtran','pngrutil','pngset','pngtrans','pngwio','pngwrite','pngwtran','pngwutil')
          Build-LegacyStatic 'lc_z' $zDir $zSources ''
          Build-LegacyStatic 'lc_png' $pngDir $pngSources $prefixPath
          "LC_PNG_PREFIX=$prefixPath" >> $env:GITHUB_ENV
          Write-Host "Rebuilt x86 original libpng with $($symbolNames.Count) isolated symbols; paired prefixed zlib"
      - name: Configure diagnostic-only legacy Engine link
        shell: pwsh
        run: |
          # SAFESEH strict is the default. Legacy mode exists only for diagnostic inventories, not release.
          $linkMode = '${{ github.event_name }}' -eq 'push' ? 'legacy_compat_audit' : '${{ inputs.link_mode }}'
          if ($linkMode -notin @('strict_safeseh','legacy_compat_audit')) { throw "Unsupported link mode: $linkMode" }
          $projPath = 'Engine/Engine_2010.vcxproj'
          [xml]$doc = Get-Content $projPath -Raw
          $ns = New-Object System.Xml.XmlNamespaceManager($doc.NameTable)
          $ns.AddNamespace('p', 'http://schemas.microsoft.com/developer/msbuild/2003')
          $matches = @($doc.SelectNodes('//p:ItemDefinitionGroup', $ns) | Where-Object { $_.Condition -like '*GERLIVE|Win32*' -and $_.Condition -notlike '*Kalydo*' })
          if ($matches.Count -ne 1) { throw "Expected one GERLIVE|Win32 group; got $($matches.Count)" }
          $link = $matches[0].SelectSingleNode('p:Link', $ns)
          if (-not $link) { throw 'Engine GERLIVE linker settings missing' }
          $se = $doc.CreateElement('ImageHasSafeExceptionHandlers', $doc.DocumentElement.NamespaceURI)
          if ($linkMode -eq 'strict_safeseh') { $se.InnerText = 'true' } else { $se.InnerText = 'false' }
          [void]$link.AppendChild($se)
          $oldOpts = [string]$link.AdditionalOptions
          $link.AdditionalOptions = "$oldOpts /NODEFAULTLIB:libpng.lib /NODEFAULTLIB:libpng16.lib /NODEFAULTLIB:libz.lib legacy_stdio_definitions.lib"
          if ($linkMode -eq 'legacy_compat_audit') {
            # ASLR and DEP are independent mitigations; we do not claim they replace SafeSEH.
            $aslr = $link.SelectSingleNode('p:RandomizedBaseAddress', $ns)
            if (-not $aslr) {
              $aslr = $doc.CreateElement('RandomizedBaseAddress', $doc.DocumentElement.NamespaceURI)
              [void]$link.AppendChild($aslr)
            }
            $aslr.InnerText = 'true'
            $link.AdditionalOptions = [string]$link.AdditionalOptions + ' /DYNAMICBASE /NXCOMPAT'
          }
          # The per-file ForcedIncludeFiles setting did not affect Texture.obj in run 22.
          # Patch the runner's checkout, never commit generated prefix definitions.
          $texturePath = 'Engine/Graphics/Texture.cpp'
          $textureText = [System.IO.File]::ReadAllText((Resolve-Path $texturePath).Path)
          $oldInclude = '#include <3rdparty/lpng163/png.h>'
          if (-not $textureText.Contains($oldInclude)) { throw 'Texture.cpp PNG include not found' }
          if (-not (Test-Path $env:LC_PNG_PREFIX)) { throw 'Isolated PNG prefix header missing' }
          $newInclude = '#include "' + ($env:LC_PNG_PREFIX -replace '\\','/') + '"' + "`n" + $oldInclude
          $textureText = $textureText.Replace($oldInclude, $newInclude)
          [System.IO.File]::WriteAllText((Resolve-Path $texturePath).Path,$textureText)
          Write-Host 'Injected PNG symbol remapping into Texture.cpp after stdh.h/PCH'
          $doc.Save((Resolve-Path $projPath).Path)
          Write-Host "Win32 link mode: $linkMode. Legacy outputs are only for private testing; no SDK or asset files will be distributed."
      - name: Attempt Win32 compilation and save diagnostic log
        if: steps.ecc.outcome == 'success' && steps.boost.outcome == 'success'
        id: compile
        shell: pwsh
        run: |
          $env:CL = '/I"' + $env:DX8_INCLUDE + '"'
          $env:LINK = '/LIBPATH:"' + $env:DX8_LIB + '" /DEFAULTLIB:d3d8.lib /DEFAULTLIB:d3dx8.lib /DEFAULTLIB:lc_png.lib /DEFAULTLIB:lc_z.lib'
          $msbuild = Join-Path "${{ steps.vs.outputs.path }}" "MSBuild\Current\Bin\MSBuild.exe"
          & $msbuild "Build_2010.sln" /m:1 /t:Build /p:Configuration=GERLIVE /p:Platform=Win32 /p:PlatformToolset=v143 /p:UseMultiToolTask=true /v:minimal "/flp:logfile=build-win32.log;verbosity=diagnostic"
          if ($LASTEXITCODE -ne 0) {
            Write-Host "Compilation failed; first compiler/linker errors:"
            Select-String -Path "build-win32.log" -Pattern 'error (C[0-9]+|LNK[0-9]+|MSB[0-9]+)|error :|fatal error|memory exhausted' | Select-Object -First 25 | ForEach-Object { Write-Host $_.Line }
            exit $LASTEXITCODE
          }
      - name: Inspect PE hardening, DLL dependencies and build outputs (no binaries uploaded)
        if: steps.compile.outcome == 'success'
        shell: pwsh
        run: |
          $vsTools = Join-Path "${{ steps.vs.outputs.path }}" "VC\Tools\MSVC"
          $dumpbin = Get-ChildItem -Path $vsTools -Filter dumpbin.exe -File -Recurse | Where-Object { $_.FullName -match 'Hostx64\\x86' } | Select-Object -First 1
          if (-not $dumpbin) { throw 'dumpbin.exe x86 tool not found' }
          & .\.github\scripts\audit-win32-client.ps1 -BinDir 'D:\Bin' -ReportPath 'win32-client-audit.txt' -DumpbinExe $dumpbin.FullName
          if (-not (Test-Path 'win32-client-audit.txt')) { throw 'PE diagnostic report missing' }
      - name: Package private Win32 test executables (legacy build only)
        if: steps.compile.outcome == 'success' && (github.event_name == 'push' || inputs.link_mode == 'legacy_compat_audit')
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $folder = Join-Path $PWD 'private-win32-test'
          New-Item -ItemType Directory -Force -Path $folder | Out-Null
          $required = 'Nksp.exe','Engine.dll','EntitiesMP.dll','GameMP.dll','Shaders.dll'
          foreach ($name in $required) {
            $p = Join-Path 'D:\Bin' $name
            if (-not (Test-Path -LiteralPath $p -PathType Leaf)) { throw "Missing core binary: $p" }
            Copy-Item -LiteralPath $p -Destination (Join-Path $folder $name)
          }
          @'
          PRIVATE TEST ONLY — NOT A COMPLETE GAME INSTALLATION
          Original Last Chaos Win32 client from xtrap-free-win32.
          X-Trap build defines are disabled. Runtime startup has NOT been tested.
          Engine.dll was linked with /SAFESEH:NO to accommodate old DirectX8 and IJL static libraries.
          This reduces exploit mitigations. Use only in an isolated, controlled test environment.
          Do not run as administrator. Do not publish or redistribute as a finished release.
          No third-party SDK libraries, DirectX runtime, VC++ redistributables, game assets,
          server files or game data archives are included in this ZIP.
          You will need a legally obtained compatible original client data installation.
          Check dependencies against win32-client-audit.txt in diagnostics artifact.
          Windows 10/11 and server protocol compatibility remain UNVERIFIED.
          '@ | Set-Content -LiteralPath (Join-Path $folder 'READ_ME_FIRST.txt') -Encoding UTF8
          Get-ChildItem -Path $folder -File | Get-FileHash -Algorithm SHA256 | ForEach-Object {
            "$($_.Hash)  $([System.IO.Path]::GetFileName($_.Path))"
          } | Set-Content -LiteralPath (Join-Path $folder 'SHA256SUMS.txt') -Encoding ASCII
      - name: Upload private test executable package (unverified, legacy-only)
        if: steps.compile.outcome == 'success' && (github.event_name == 'push' || inputs.link_mode == 'legacy_compat_audit')
        uses: actions/upload-artifact@v4
        with:
          name: PRIVATE-TEST-UNVERIFIED-LastChaos-Win32
          if-no-files-found: error
          retention-days: 3
          path: private-win32-test/
      - name: Publish diagnostic logs only (no unverified binaries)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: win32-build-diagnostics
          if-no-files-found: warn
          retention-days: 7
          path: |
            build-win32.log
            ecc-win32.log
            lua-win32.log
            lc_png-win32.log
            lc_z-win32.log
            win32-client-audit.txt
