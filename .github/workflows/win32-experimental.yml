name: Win32 Last Chaos experimental build
on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - '.github/workflows/win32-experimental.yml'

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: xtrap-free-win32
      - name: Check X-Trap build defines
        shell: pwsh
        run: |
          $regions = 'BRA','GAMIGO','RUS','USA'
          foreach ($region in $regions) {
            $path = "Engine/Define_$region.h"
            if (Select-String -Path $path -Pattern '^\s*#define\s+XTRAP_SECURE_CKBANG_2010_07_20\b' -Quiet) {
              throw "X-Trap still enabled in $path"
            }
            Write-Host "X-Trap disabled in $path"
          }
      - name: Verify migrated Boost.Asio network code
        shell: pwsh
        run: |
          $paths = 'Engine/Network/NetClient.h','Engine/Network/NetClient.cpp','Engine/Contents/Login/UILoginNew.cpp'
          if (Select-String -Path $paths -Pattern 'boost::asio::io_service|_socket.get_io_service\(' -Quiet) {
            throw "Legacy Boost.Asio API remains in network client files"
          }
          Write-Host "Boost.Asio io_context migration detected"
      - name: Locate Visual Studio build tools
        id: vs
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.Component.MSBuild -property installationPath
          if (-not $vs) { throw "MSBuild not found" }
          "path=$vs" >> $env:GITHUB_OUTPUT
          Write-Host "VS: $vs"
      - name: Prepare legacy DirectX 8 and D3DX8 build dependencies
        shell: pwsh
        run: |
          # Build-only SDK retrieval; do not commit or upload SDK material.
          # Third-party archive of Microsoft's SDK: license must be respected.
          $root = Join-Path $env:RUNNER_TEMP 'directx8-sdk'
          git clone --depth 1 --filter=blob:none --sparse https://github.com/edgeforce/directx8.git $root
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Push-Location $root
          git fetch --depth 1 origin e6fa10f5f92bf523c15fdb068206ce25c8d2121d
          if ($LASTEXITCODE -ne 0) { throw 'Pinned SDK source unavailable' }
          git checkout --detach e6fa10f5f92bf523c15fdb068206ce25c8d2121d
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git sparse-checkout set include lib license
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Pop-Location

          $srcInc = Join-Path $root 'include'
          $srcLib = Join-Path $root 'lib'
          $out = Join-Path $env:RUNNER_TEMP 'legacy-dx8-build'
          $inc = Join-Path $out 'include'
          $lib = Join-Path $out 'lib'
          New-Item -ItemType Directory -Force -Path $inc,$lib | Out-Null
          $headers = @(
            'd3d8.h', 'd3d8types.h', 'd3d8caps.h',
            'd3dx8.h', 'd3dx8core.h', 'd3dx8tex.h',
            'd3dx8math.h', 'd3dx8math.inl',
            'd3dx8mesh.h', 'd3dx8shape.h', 'd3dx8effect.h',
            'dxfile.h', 'dxerr8.h'
          )
          foreach ($file in $headers) {
            $source = Join-Path $srcInc $file
            if (-not (Test-Path $source)) { throw "DX8 SDK required header missing: $file" }
            Copy-Item $source (Join-Path $inc $file) -Force
          }
          foreach ($file in @('d3d8.lib', 'd3dx8.lib', 'dxguid.lib', 'd3dxof.lib')) {
            $source = Join-Path $srcLib $file
            if (-not (Test-Path $source)) { throw "DX8 SDK required Win32 library missing: $file" }
            Copy-Item $source (Join-Path $lib $file) -Force
          }
          "DX8_INCLUDE=$inc" >> $env:GITHUB_ENV
          "DX8_LIB=$lib" >> $env:GITHUB_ENV
          Write-Host "Prepared legacy DirectX8 and D3DX8 build-only headers and libs"
      - name: Install Ecc parser prerequisites
        id: parser
        shell: pwsh
        run: |
          choco install winflexbison3 -y --no-progress
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $directory = Join-Path $env:ChocolateyInstall "lib\\winflexbison3\\tools"
          if (-not (Test-Path (Join-Path $directory "win_bison.exe"))) { throw "win_bison.exe was not found in $directory" }
          Copy-Item (Join-Path $directory "win_bison.exe") (Join-Path $directory "bison.exe") -Force
          Copy-Item (Join-Path $directory "win_flex.exe") (Join-Path $directory "flex.exe") -Force
          Add-Content $env:GITHUB_PATH $directory
      - name: Build Last Chaos Ecc tool
        id: ecc
        shell: pwsh
        run: |
          $msbuild = Join-Path "${{ steps.vs.outputs.path }}" "MSBuild\\Current\\Bin\\MSBuild.exe"
          & $msbuild "Ecc\\Ecc_2010.vcxproj" /m:1 /t:Build /p:Configuration=Release /p:Platform=Win32 /p:PlatformToolset=v143 /v:minimal "/flp:logfile=ecc-win32.log;verbosity=diagnostic"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path "Ecc\\Release\\Ecc.exe")) { throw "Ecc.exe was not generated in Ecc/Release" }
          (Resolve-Path "Ecc\\Release").Path >> $env:GITHUB_PATH
      - name: Install Boost thread for Win32
        id: boost
        shell: pwsh
        run: |
          $vcpkgRoot = $env:VCPKG_INSTALLATION_ROOT
          if (-not $vcpkgRoot) { $vcpkgRoot = 'C:\vcpkg' }
          $vcpkg = Join-Path $vcpkgRoot 'vcpkg.exe'
          if (-not (Test-Path $vcpkg)) { throw "vcpkg.exe not found at $vcpkg" }
          & $vcpkg install boost-thread:x86-windows boost-format:x86-windows boost-multi-index:x86-windows boost-bind:x86-windows boost-function:x86-windows boost-smart-ptr:x86-windows boost-asio:x86-windows
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $vcpkg integrate install
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path (Join-Path $vcpkgRoot "installed\x86-windows\include\boost\asio.hpp"))) { throw "Boost Asio missing" }
          if (-not (Test-Path (Join-Path $vcpkgRoot "installed\x86-windows\include\boost\multi_index_container.hpp"))) { throw "Boost MultiIndex missing" }
          if (-not (Test-Path (Join-Path $vcpkgRoot "installed\x86-windows\include\boost\format.hpp"))) { throw "Boost format header missing after installation" }
          if (-not (Test-Path (Join-Path $vcpkgRoot "installed\x86-windows\include\boost\thread.hpp"))) {
            throw "Boost thread header missing after installation"
          }
      - name: Attempt Win32 compilation and save diagnostic log
        if: steps.ecc.outcome == 'success' && steps.boost.outcome == 'success'
        id: compile
        shell: pwsh
        run: |
          $env:CL = '/I"' + $env:DX8_INCLUDE + '"'
          $env:LINK = '/LIBPATH:"' + $env:DX8_LIB + '" /DEFAULTLIB:d3d8.lib /DEFAULTLIB:d3dx8.lib'
          $msbuild = Join-Path "${{ steps.vs.outputs.path }}" "MSBuild\Current\Bin\MSBuild.exe"
          & $msbuild "Build_2010.sln" /m:2 /t:Build /p:Configuration=GERLIVE /p:Platform=Win32 /p:PlatformToolset=v143 /p:UseMultiToolTask=true /v:minimal "/flp:logfile=build-win32.log;verbosity=diagnostic"
          if ($LASTEXITCODE -ne 0) { Write-Host "Compilation failed: inspect build-win32.log"; exit $LASTEXITCODE }
      - name: Publish compiler log and any generated binaries
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: win32-build-diagnostics
          if-no-files-found: warn
          retention-days: 7
          path: |
            build-win32.log
            ecc-win32.log
            **/Engine.dll
            **/Nksp.exe
